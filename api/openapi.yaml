openapi: 3.1.0
info:
  title: Digital Forensics Web API
  version: 0.1.0-a
  description: |
    Phase A implements only `/health` and `/api/v1/meta`.

    Paths under "Draft (not implemented)" are a contract sketch for later phases.
    Do not treat them as live until their phase ships.

    Data: `web_data/` only. Never desktop `forensics.db` / `data/`.
servers:
  - url: http://127.0.0.1:8000
    description: Local development

tags:
  - name: health
  - name: meta
  - name: cases
    description: Draft — not implemented in Phase A
  - name: evidence
    description: Draft — not implemented in Phase A
  - name: jobs
    description: Draft — not implemented in Phase A
  - name: events
    description: Draft — not implemented in Phase A
  - name: findings
    description: Draft — not implemented in Phase A
  - name: graph
    description: Draft — not implemented in Phase A
  - name: integrity
    description: Draft — not implemented in Phase A
  - name: export
    description: Draft — not implemented in Phase A
  - name: live
    description: Draft — not implemented in Phase A

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness
      operationId: getHealth
      responses:
        "200":
          description: Service is up (Phase A)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/meta:
    get:
      tags: [meta]
      summary: Product IA, glossary, feature flags
      operationId: getMeta
      responses:
        "200":
          description: Clarity contract for the UI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"

  # --- Draft (not implemented in Phase A) ---

  /api/v1/cases:
    get:
      tags: [cases]
      summary: "[Draft] List cases"
      operationId: listCases
      responses:
        "501":
          description: Not implemented in Phase A
    post:
      tags: [cases]
      summary: "[Draft] Create case"
      operationId: createCase
      responses:
        "501":
          description: Not implemented in Phase A

  /api/v1/cases/{case_id}:
    get:
      tags: [cases]
      summary: "[Draft] Get case"
      operationId: getCase
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "501":
          description: Not implemented in Phase A

  /api/v1/cases/{case_id}/evidence:
    get:
      tags: [evidence]
      summary: "[Draft] List evidence"
      operationId: listEvidence
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "501":
          description: Not implemented in Phase A
    post:
      tags: [evidence]
      summary: "[Draft] Upload evidence"
      operationId: uploadEvidence
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "501":
          description: Not implemented in Phase A

  /api/v1/cases/{case_id}/analyze:
    post:
      tags: [jobs]
      summary: "[Draft] Start analysis job"
      operationId: startAnalysis
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "501":
          description: Not implemented in Phase A

  /api/v1/cases/{case_id}/events:
    get:
      tags: [events]
      summary: "[Draft] Timeline events"
      operationId: listEvents
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "501":
          description: Not implemented in Phase A

  /api/v1/cases/{case_id}/findings:
    get:
      tags: [findings]
      summary: "[Draft] Findings + activity stories"
      operationId: listFindings
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "501":
          description: Not implemented in Phase A

  /api/v1/cases/{case_id}/graph:
    get:
      tags: [graph]
      summary: "[Draft] Connections graph JSON"
      operationId: getGraph
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - name: view
          in: query
          schema:
            type: string
            enum: [simple, detailed]
            default: simple
      responses:
        "501":
          description: Not implemented in Phase A

  /api/v1/cases/{case_id}/integrity:
    get:
      tags: [integrity]
      summary: "[Draft] Integrity rows"
      operationId: listIntegrity
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "501":
          description: Not implemented in Phase A

  /api/v1/cases/{case_id}/export:
    get:
      tags: [export]
      summary: "[Draft] Export report"
      operationId: exportCase
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "501":
          description: Not implemented in Phase A

  /api/v1/live/status:
    get:
      tags: [live]
      summary: "[Draft] Live watch status"
      operationId: liveStatus
      responses:
        "501":
          description: Not implemented in Phase A

components:
  parameters:
    CaseId:
      name: case_id
      in: path
      required: true
      schema:
        type: string

  schemas:
    HealthResponse:
      type: object
      required: [status, phase, version, features]
      properties:
        status:
          type: string
          example: ok
        phase:
          type: string
          example: A
        version:
          type: string
          example: 0.1.0-a
        data_root:
          type: string
        database_url:
          type: string
          description: Planned SQLite URL — file not created in Phase A
        features:
          type: object
          additionalProperties:
            type: boolean

    MetaResponse:
      type: object
      required: [phase, version, product_name, nav, glossary, features, principles]
      properties:
        phase:
          type: string
          example: A
        version:
          type: string
        product_name:
          type: string
        theme_default:
          type: string
          example: light
        theme_accent:
          type: string
          example: white_blue
        mvp_focus:
          type: string
          example: import_first
        data_isolation:
          type: string
          example: web_data_only
        principles:
          type: array
          items:
            type: string
        nav:
          type: object
          properties:
            primary:
              type: array
              items:
                $ref: "#/components/schemas/NavItem"
            secondary:
              type: array
              items:
                $ref: "#/components/schemas/NavItem"
        glossary:
          type: array
          items:
            type: object
            properties:
              avoid:
                type: string
              prefer:
                type: string
        features:
          type: object
          additionalProperties:
            type: boolean
        message:
          type: string

    NavItem:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        path:
          type: string
        job:
          type: string
          description: One-sentence purpose of this screen
